# StorageClass? 스토리지 프로비저닝을 정의하는 객체. PV를 어떻게 생성하고 관리할지 정의되어 있음
# csi(container storage interface)? AWS EFS와 같은 cloud storage를 Kubernetes에 쉽게 연결할 수 있도록 인터페이스 제공
# https://github.com/kubernetes-sigs/aws-efs-csi-driver/blob/master/examples/kubernetes/static_provisioning/specs/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com # aws에서 제공하는 pv를 동적 프로비저닝하는 csi(container storage interface) 드라이버
---
apiVersion: v1
kind: PersistentVolume # pv 생성
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc # csi 드라이버 사용
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0a5f20fbfaf4d9d4b # 연결할 efs의 file system ID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-pvc
spec:
  # 최소 5Gi이고 다중 노드에서 읽기/쓰기가 가능하고 csi를 사용하는 스토리지 요청
  resources:
    requests:
      storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany # csi는 multi-node 환경(AWS EKS)에서 사용 가능
  storageClassName: efs-sc # StorageClass 이름. volume-name을 따로 지정하지 않았으므로 csi 드라이버가 pv를 생성하거나 기존 pv 중에서 자동 바인딩
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users
  type: LoadBalancer # 외부와 통신해야하는 pod
  ports:
    - protocol: TCP
      port: 80 # 서비스를 노출할 포트
      targetPort: 3000 # users-app.js app.listen(3000) 앱 내부에서 수신하고 있는 포트
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users-api
          image: dyckerkim/kub-dep-users:latest
          env:
            - name: MONGODB_CONNECTION_URI
              # value: "mongodb+srv://maximilian:wk4nFupsbntPbB3l@cluster0.ntrwp.mongodb.net/users?retryWrites=true&w=majority"
              value: "mongodb://max:secret@mongodb-service.default:27017/users?authSource=admin"
            - name: AUTH_API_ADDRESS
              value: "auth-service.default:3000"
          # resources:
          #   limits:
          #     memory: "128Mi"
          #     cpu: "500m"
          volumeMounts:
            - name: efs-vol
              mountPath: /app/users # users 폴더에 데이터 저장
      volumes: # 볼륨 정의 안해놓으면 volumeMounts에서 못씀
        - name: efs-vol
          persistentVolumeClaim:
            claimName: efs-pvc
