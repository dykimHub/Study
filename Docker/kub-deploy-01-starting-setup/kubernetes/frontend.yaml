apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  type: LoadBalancer # 외부와 통신해야하는 pod
  ports:
    - protocol: TCP
      port: 80 # 서비스를 노출할 포트
      targetPort: 80 # nginx.conf listen 80 앱 내부에서 수신하고 있는 포트
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: dyckerkim/kub-dep-frontend:latest
          # resources:
          #   limits:
          #     memory: "128Mi"
          #     cpu: "500m"
