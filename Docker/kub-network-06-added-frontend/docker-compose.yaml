services:
  auth:
    build: ./auth-api
  users:
    build: ./users-api
    environment:
      # AUTH_ADDRESS: auth
      AUTH_SERVICE_SERVICE_HOST: auth # 쿠버네티스 서비스 자동 할당 되는 환경변수라서 docker-compose에서는 명시해야 함
    ports:
      - "8080:8080"
  tasks:
    build: ./tasks-api
    ports:
      - "8000:8000"
    environment:
      TASKS_FOLDER: tasks
      AUTH_ADDRESS: auth
    volumes:
      - /app/tasks
