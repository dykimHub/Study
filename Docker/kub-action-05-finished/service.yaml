apiVersion: v1
kind: Service # group: core(기본), version: v1, kind: Deployment
metadata:
  name: backend # kubectl expose deployment kub-first-app --type=LoadBalancer --port=8080 --name={name} 과 같음
  labels:
    group: example # example 그룹에 속하는 리소스(pods, service 등)
spec:
  selector: # 식별자
    app: second-app # # second-app이라는 app을 관리할 서비스
  ports:
    - protocol: "TCP" # http, https 등의 프로토콜은 TCP를 기반
      port: 80 # 외부 port
      targetPort: 8080 # 컨테이너 내부 port
  type: LoadBalancer # 클라우드 제공자의 LoadBalancer를 통해 공용 IP를 할당받아 클러스터 외부 접근 가능 (ClusterIP: 외부 접근 불가, NodePort: 각 노드의 IP와 고정된 포트를 통해 접근 가능)
